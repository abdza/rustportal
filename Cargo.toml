[package]
name = "rustportal"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
resolver = "3"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
tokio-util = { version = "0.7", features = ["io"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "rust_decimal", "json"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rhai = { version = "1", features = ["sync", "serde"] }
minijinja = { version = "2", features = ["json"] }
bcrypt = "0.15"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rust_xlsxwriter = { version = "0.79", features = ["constant_memory"] }
calamine = "0.26"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
regex = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false }
mime_guess = "2"
toml = "0.8"
urlencoding = "2"
async-trait = "0.1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
