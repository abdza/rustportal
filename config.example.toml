# Copy to config.toml and adjust. Every key is optional.
port = 9090
address = "0.0.0.0"
# PostgreSQL (recommended for production / sharing a DB with a Grails portal):
database_url = "postgres://postgres@localhost/rustportal"
# Microsoft SQL Server (supports mssql://, sqlserver://, g5portal's jdbc:sqlserver://, or ADO.NET Server=...):
# database_url = "mssql://sa:dbpassword@localhost:1433/cbmyportal?encrypt=true&trustServerCertificate=true"
# database_url = "jdbc:sqlserver://localhost:1433;databaseName=cbmyportal;user=sa;password=dbpassword;encrypt=true;trustServerCertificate=true;socketTimeout=300000;"
# Or use embedded SQLite for zero-setup single-file deployment (no DB server needed):
# database_url = "sqlite://rustportal.db"
upload_dir = "uploads"
module_dir = "modulemigration"
# where pages and their data sources are kept. Point these at your own tables to run
# on a Grails portal's database next to it: everything else is shared, the pages are not.
# page_table = "portal_page"
# page_data_table = "portal_page_data"
# g6 Grails portal compatibility mode (GSP role rules, raw HTML field display, file links)
# g6_schema = false
# run scheduled pages and send queued e-mail; turn off when the other portal on the
# same database already does, or every job runs twice
# run_scheduler = true
# run Telegram bot long-poller, outbox sender, and email mirroring (defaults to run_scheduler)
# run_telegram = true
# time zone for the database session (SQL now(), current_date). Unset: this
# machine's zone when g6_schema is on (as a Grails portal's JDBC driver uses),
# otherwise UTC
# db_timezone = "Asia/Kuala_Lumpur"
# Content-Security-Policy header for every page; unset sends none. To match a g6
# portal, which keeps pages to their own site's resources, use its policy:
# content_security_policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'self'"
# g6 portals: the tracker ("module.slug") holding each user's member record
# (portal_user.profile_id), which pages and role rules see as session['profile']
# user_profile = "ahli.ahli"
# folders searched before this portal's own static files for /assets/x
# (e.g. a Grails portal's grails-app/assets/images, javascripts, stylesheets, libs)
# assets_dirs = []
app_name = "Portal"
# branding (settings saved in the "branding" module win over these):
# copyright = ""     # footer "Copyright <b>...</b>", default: app_name
# team = ""          # footer "Designed by ...", default: "<app_name> Team"
# logo_url = ""      # default /static/images/logo.png
# favicon_url = ""   # default /static/images/favicon.svg
# link on "Designed by <app name> Team" in the footer
# credits_url = "https://example.com/"
allow_registration = false
# Set true to disable Active Directory authentication completely (local passwords only, matching g5portal's server.disable_lanid):
disable_lanid = false
session_hours = 12
# Optional: session inactivity timeout in minutes (overrides session_hours;
# can also be overridden live via Settings -> portal.session_minutes)
# session_minutes = 30

[mail]
host = "127.0.0.1"
port = 1025
from = "portal@localhost"
# starttls = true
disabled = false

# Active Directory (LDAP / LDAPS) authentication, matching g5portal.
# Every field here can also be set or overridden live via portal_setting using the
# same keys as g5portal: adenable, enforce_lanid, adtimeout, ad_tls_no_verify,
# adserver / adport / adsecure / addn / adpassword / adbase (primary domain), and
# adserver2 / adport2 / adsecure2 / addn2 / adpassword2 / adbase2 (secondary domain).
# [active_directory]
# enabled = false
# enforce_lanid = false
# timeout_ms = 5000
# tls_no_verify = true
#
# [[active_directory.domains]]
# label = "primary"
# server = "ldaps.domain1.example.com"
# port = 636
# secure = true
# bind_dn = "CN=svc_ldap,OU=LdapService,DC=domain1,DC=example,DC=com"
# bind_password = "service_password"
# base_dn = "DC=domain1,DC=example,DC=com"
#
# [[active_directory.domains]]
# label = "secondary"
# server = "ldaps.domain2.example.com"
# port = 636
# secure = true
# bind_dn = "CN=svc_ldap,OU=Application Usage,DC=domain2,DC=example,DC=com"
# bind_password = "service_password"
# base_dn = "DC=domain2,DC=example,DC=com"

# [google_oauth]
# client_id = ""
# client_secret = ""
# callback_url = "https://example.com/auth/google/callback"
