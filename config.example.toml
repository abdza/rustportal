# Copy to config.toml and adjust. Every key is optional.
port = 9090
address = "0.0.0.0"
database_url = "postgres://postgres@localhost/rustportal"
upload_dir = "uploads"
module_dir = "modulemigration"
# where pages and their data sources are kept. Point these at your own tables to run
# on a Grails portal's database next to it: everything else is shared, the pages are not.
# page_table = "portal_page"
# page_data_table = "portal_page_data"
# g6 Grails portal compatibility mode (GSP role rules, raw HTML field display, file links)
# g6_schema = false
# run scheduled pages and send queued e-mail; turn off when the other portal on the
# same database already does, or every job runs twice
# run_scheduler = true
# run Telegram bot long-poller, outbox sender, and email mirroring (defaults to run_scheduler)
# run_telegram = true
# time zone for the database session (SQL now(), current_date). Unset: this
# machine's zone when g6_schema is on (as a Grails portal's JDBC driver uses),
# otherwise UTC
# db_timezone = "Asia/Kuala_Lumpur"
# Content-Security-Policy header for every page; unset sends none. To match a g6
# portal, which keeps pages to their own site's resources, use its policy:
# content_security_policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'self'"
# g6 portals: the tracker ("module.slug") holding each user's member record
# (portal_user.profile_id), which pages and role rules see as session['profile']
# user_profile = "ahli.ahli"
# folders searched before this portal's own static files for /assets/x
# (e.g. a Grails portal's grails-app/assets/images, javascripts, stylesheets, libs)
# assets_dirs = []
app_name = "Portal"
# branding (settings saved in the "branding" module win over these):
# copyright = ""     # footer "Copyright <b>...</b>", default: app_name
# team = ""          # footer "Designed by ...", default: "<app_name> Team"
# logo_url = ""      # default /static/images/logo.png
# favicon_url = ""   # default /static/images/favicon.ico
# link on "Designed by <app name> Team" in the footer
# credits_url = "https://example.com/"
allow_registration = false
session_hours = 12

[mail]
host = "127.0.0.1"
port = 1025
from = "portal@localhost"
# starttls = true
disabled = false

# [google_oauth]
# client_id = ""
# client_secret = ""
# callback_url = "https://example.com/auth/google/callback"
